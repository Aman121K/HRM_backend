# Single-server add-on for docker-compose.prod.yml: one EC2 host runs web + api + worker + redis + Caddy, with
# Postgres on Amazon RDS and files on S3. Use both files together (see deploy/single-server/README.md):
#
#   docker compose -f docker-compose.prod.yml -f deploy/single-server/docker-compose.single.yml --env-file .env.production up -d
#
# Caddy terminates TLS with a Cloudflare Origin Certificate for <APP_DOMAIN> + *.<APP_DOMAIN> and routes:
#   api.<APP_DOMAIN>                    → api:4100
#   app.<APP_DOMAIN>, *.<APP_DOMAIN>    → web:3000 (brand subdomains)
# Memory limits are sized for a 2 GB t4g.small with 2 GB swap.

x-rds-ca: &rds-ca
  - ./deploy/single-server/certs/rds-global-bundle.pem:/etc/ssl/certs/rds-global-bundle.pem:ro

services:
  migrate:
    volumes: *rds-ca
  api:
    volumes: *rds-ca
    mem_limit: 512m
  worker:
    volumes: *rds-ca
    mem_limit: 384m
    environment:
      JOBS_CONCURRENCY: ${JOBS_CONCURRENCY:-2}
  web:
    mem_limit: 512m
  redis:
    mem_limit: 160m

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    mem_limit: 96m
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?e.g. clanchief.com}
    volumes:
      - ./deploy/single-server/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/single-server/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_started }
      api: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  caddy-data: {}
  caddy-config: {}
